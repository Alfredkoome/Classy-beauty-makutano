<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Classy Beauty Makutano</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: #111;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            width: 350px;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            color: #c9a24b;
            text-align: center;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0;

            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;

            background: #c9a24b;
            color: #111;
            border: none;
            border-radius: 5px;

            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.85;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
        button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;

    background: #c9a24b;
    color: #111;
    border: none;
    border-radius: 5px;

    cursor: pointer;
    font-weight: 600;

    transition: 0.3s ease;
}

button:hover {
    background: #e0bd65;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(201, 162, 75, 0.3);
}
input:hover {
    border-color: #c9a24b;
}

input:focus {
    outline: none;
    border-color: #c9a24b;
    box-shadow: 0 0 8px rgba(201, 162, 75, 0.25);
}

    </style>
</head>

<body>

    <div class="login-box">

        <h1>Admin Login</h1>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p id="message"></p>

    </div>

    <script>

        document.getElementById("loginForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const response = await fetch("http://127.0.0.1:3000/admin/login", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const result = await response.text();

            if (response.ok) {
                window.location.href = "admin.html";
            } else {
                document.getElementById("message").textContent = result;
            }

        });

    </script>

</body>
</html>
