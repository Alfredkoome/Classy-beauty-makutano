<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Classy Beauty Makutano</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: #111;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            width: 350px;
            background: #1a1a1a;
            padding: 35px;
            border-radius: 12px;

            border: 1px solid rgba(201, 162, 75, 0.5);

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.7),
                0 0 25px rgba(201, 162, 75, 0.08);
        }

        .brand {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        h1 {
            color: #c9a24b;
            text-align: center;
            margin-top: 0;
            margin-bottom: 28px;
            font-size: 28px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 5px 0;

            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;

            transition: 0.3s ease;
        }

        input:hover {
            border-color: #c9a24b;
        }

        input:focus {
            outline: none;
            border-color: #c9a24b;

            box-shadow:
                0 0 8px rgba(201, 162, 75, 0.25);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;

            background: #c9a24b;
            color: #111;

            border: none;
            border-radius: 6px;

            cursor: pointer;
            font-weight: 600;
            font-family: "Poppins", sans-serif;

            transition: 0.3s ease;
        }

        button:hover {
            background: #e0bd65;
            transform: translateY(-2px);

            box-shadow:
                0 6px 18px rgba(201, 162, 75, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        #message {
            text-align: center;
            margin-top: 18px;
            min-height: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="brand">
            Classy Beauty Makutano
        </div>

        <h1>Admin Login</h1>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p id="message"></p>

    </div>

    <script>

        document.getElementById("loginForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;

                try {

                    const response = await fetch(
                        "https://classy-beauty-makutano-2.onrender.com/admin/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            credentials: "include",

                            body: JSON.stringify({
                                username: username,
                                password: password
                            })
                        }
                    );

                    const result = await response.text();

                    if (response.ok) {

                        window.location.href = "admin.html";

                    } else {

                        document.getElementById("message").textContent =
                            result;

                    }

                } catch (error) {

                    console.error(error);

                    document.getElementById("message").textContent =
                        "Could not connect to the server.";

                }

            }
        );

    </script>

</body>
</html>
